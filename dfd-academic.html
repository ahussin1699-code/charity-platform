<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFD — منصة تبرعات خيرية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f7ff; font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; padding: 20px; }
  h2 { text-align: center; color: #3b5fc0; margin: 18px 0 10px; font-size: 1.3rem; }
  .controls { text-align: center; margin: 10px 0 18px; }
  button {
    padding: 9px 22px; margin: 4px; background: #3b5fc0;
    color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem;
  }
  button:hover { background: #2a4aaa; }
  .svg-wrap { overflow-x: auto; background: #fff; border: 1px solid #dde; border-radius: 8px; padding: 10px; }
  hr { margin: 36px 0; border-color: #ccd; }
</style>
</head>
<body>

<!-- ========== DFD LEVEL 0 ========== -->
<h2>DFD Level 0 — منصة تبرعات خيرية</h2>
<div class="controls">
  <button onclick="dlSVG('svgL0','DFD-Level0.svg')">⬇️ تحميل Level 0 SVG</button>
</div>
<div class="svg-wrap" id="l0wrap"></div>

<!-- ========== DFD LEVEL 1 ========== -->
<hr>
<h2>DFD Level 1 — منصة تبرعات خيرية</h2>
<div class="controls">
  <button onclick="dlSVG('svgL1','DFD-Level1.svg')">⬇️ تحميل Level 1 SVG</button>
</div>
<div class="svg-wrap" id="l1wrap"></div>

<script>
// =====================================================================
//  SHARED HELPERS
// =====================================================================
const C = { dark:'#3b5fc0', light:'#d6e0f7', white:'#ffffff', text:'#1a1a2e', arrow:'#2a3f9f', line:'#aab4d8' };

function svgRect(x,y,w,h,fill,stroke,rx=3,sw=1.8){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" rx="${rx}"/>`;
}
function svgText(x,y,txt,size,bold,fill,anchor='middle',dy=0){
  return `<text x="${x}" y="${y}" dy="${dy}" text-anchor="${anchor}" dominant-baseline="middle"
    font-size="${size}" font-weight="${bold?'bold':'normal'}" fill="${fill}"
    font-family="'Segoe UI',Tahoma,sans-serif">${txt}</text>`;
}
// Process box: top half dark, bottom half light
function svgProcess(x,y,w,h,num,label){
  const half=Math.round(h*0.42);
  let s = svgRect(x,y,w,half,C.dark,C.dark,0,0);
  s += svgRect(x,y+half,w,h-half,C.light,C.dark,0,1.8);
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${C.dark}" stroke-width="2"/>`;
  s += svgText(x+w/2, y+half/2, num, 15, true, C.white);
  // wrap label
  const lines = wrapAr(label, 18);
  const lh = 14, startY = y+half+(h-half)/2 - (lines.length-1)*lh/2;
  lines.forEach((l,i)=>{ s += svgText(x+w/2, startY+i*lh, l, 11, false, C.dark); });
  return s;
}
function svgEntity(x,y,w,h,label){
  let s = svgRect(x,y,w,h,C.dark,C.dark,4,0);
  const lines = wrapAr(label,14);
  const lh=14, startY=y+h/2-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{ s += svgText(x+w/2, startY+i*lh, l, 11, true, C.white); });
  return s;
}
function svgStore(x,y,w,h,label){
  let s = svgRect(x,y,w,h,C.light,C.dark,3,1.8);
  const lines = wrapAr(label,22);
  const lh=13, startY=y+h/2-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{ s += svgText(x+w/2, startY+i*lh, l, 10.5, false, C.dark); });
  return s;
}
// Simple arrow with label
function svgArrow(x1,y1,x2,y2,label,lside='top',markerId='ah'){
  const angle = Math.atan2(y2-y1,x2-x1);
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const off = lside==='top'?-9:12;
  const px=-Math.sin(angle)*off, py=Math.cos(angle)*off;
  let s=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.arrow}" stroke-width="1.6" marker-end="url(#${markerId})"/>`;
  if(label) s+=svgText(mx+px, my+py, label, 9.5, false, C.text);
  return s;
}
function wrapAr(str, maxLen){
  if(str.length<=maxLen) return [str];
  const words=str.split(' ');
  const lines=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>maxLen&&cur){lines.push(cur.trim());cur=w;}else{cur=(cur+' '+w).trim();} });
  if(cur) lines.push(cur.trim());
  return lines;
}
function dlSVG(id,name){
  const el=document.getElementById(id);
  const data=new XMLSerializer().serializeToString(el);
  const blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}

// =====================================================================
//  DFD LEVEL 0
// =====================================================================
function buildL0(){
  // كبّرنا الـ canvas عشان في مساحة كافية للنصوص
  const W=1600, H=1200;
  // System box في المنتصف
  const SX=480, SY=280, SW=640, SH=500;
  const SHalf=Math.round(SH*0.38);
  // Entity sizes
  const EW=130, EH=54;

  // Entity positions — بعيدة عن النظام بما يكفي للنصوص
  const donor = {x:30,        y:SY+SH/2-EH/2};   // يسار
  const sup   = {x:W-EW-30,   y:SY+SH/2-EH/2};   // يمين
  const doc   = {x:W/2-EW/2,  y:40};              // أعلى
  const ben   = {x:W/2-EW/2,  y:H-EH-40};         // أسفل

  // ---- بيانات الأسهم ----
  // كل سهم أفقي له STEP_H=38px بين سطر وسطر (كافي للنص فوق وتحت)
  const STEP_H = 38;
  const arrowStartY = SY + 30;

  const donorArrows = [
    {dir:'out', label:'إنشاء حساب'},
    {dir:'in',  label:'تأكيد البيانات'},
    {dir:'out', label:'تسجيل الدخول'},
    {dir:'in',  label:'تأكيد الجلسة'},
    {dir:'in',  label:'عرض البيانات'},
    {dir:'out', label:'تصفح الحالات'},
    {dir:'out', label:'اختيار حالة'},
    {dir:'in',  label:'تفاصيل الحالة'},
    {dir:'out', label:'إجراء التبرع'},
    {dir:'in',  label:'تأكيد التبرع'},
  ];
  const supArrows = [
    {dir:'out', label:'تسجيل البيانات'},
    {dir:'in',  label:'تأكيد التسجيل'},
    {dir:'out', label:'إدارة المستخدمين'},
    {dir:'in',  label:'عرض طلبات المستفيد'},
    {dir:'out', label:'مراجعة الطلبات'},
    {dir:'in',  label:'إرسال بيانات للطبيب'},
    {dir:'out', label:'تأكيد القبول أو الرفض'},
    {dir:'in',  label:'عرض التبرعات'},
    {dir:'out', label:'إدارة الحالات'},
    {dir:'in',  label:'الإشعارات'},
  ];

  // الأسهم العمودية: dx بين كل سهم 55px عشان النصوص ما تتداخل
  const docArrows = [
    {dx:-110, dir:'out', label:'إنشاء حساب'},
    {dx: -55, dir:'in',  label:'تأكيد البيانات'},
    {dx:   0, dir:'out', label:'تسجيل الدخول'},
    {dx:  55, dir:'in',  label:'تأكيد التسجيل'},
    {dx: 110, dir:'in',  label:'المستندات الطبية'},
  ];
  const benArrows = [
    {dx:-140, dir:'out', label:'إنشاء حساب'},
    {dx: -90, dir:'in',  label:'تأكيد البيانات'},
    {dx: -40, dir:'out', label:'بيانات التسجيل'},
    {dx:  10, dir:'in',  label:'تأكيد البيانات'},
    {dx:  60, dir:'out', label:'طلب تبرع'},
    {dx: 110, dir:'in',  label:'قبول أو رفض الطلب'},
    {dx: 160, dir:'out', label:'رفع مستندات إثبات'},
  ];

  let s = `<svg id="svgL0" xmlns="http://www.w3.org/2000/svg"
    width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
    style="font-family:'Segoe UI',Tahoma,sans-serif;direction:rtl;background:#fff;display:block;">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="${C.arrow}"/>
    </marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="1" refY="3.5" orient="auto">
      <path d="M9,0 L9,7 L0,3.5 z" fill="${C.arrow}"/>
    </marker>
  </defs>`;

  // مستطيل النظام
  s += svgRect(SX,SY,SW,SHalf,C.dark,C.dark,0,0);
  s += svgRect(SX,SY+SHalf,SW,SH-SHalf,C.light,C.dark,0,2.5);
  s += `<rect x="${SX}" y="${SY}" width="${SW}" height="${SH}" fill="none" stroke="${C.dark}" stroke-width="2.5"/>`;
  s += svgText(SX+SW/2, SY+SHalf/2, '0', 60, true, C.white);
  s += svgText(SX+SW/2, SY+SHalf+(SH-SHalf)/2, 'تبرعات خيرية', 26, true, C.dark);

  // الـ Entities
  s += svgEntity(donor.x, donor.y, EW, EH, 'متبرع');
  s += svgEntity(sup.x,   sup.y,   EW, EH, 'مشرف');
  s += svgEntity(doc.x,   doc.y,   EW, EH, 'الطبيب');
  s += svgEntity(ben.x,   ben.y,   EW, EH, 'المستفيد');

  // ---- أسهم المتبرع (يسار) ----
  // النص فوق السهم للـ out، وتحته للـ in — مع مسافة 14px
  donorArrows.forEach((a,i)=>{
    const yy = arrowStartY + i*STEP_H;
    if(yy > SY+SH-10) return;
    const x1 = donor.x+EW, x2 = SX;
    const mx = (x1+x2)/2;
    if(a.dir==='out'){
      s += `<line x1="${x1}" y1="${yy}" x2="${x2-2}" y2="${yy}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah)"/>`;
      s += svgText(mx, yy-9, a.label, 10, false, C.text);
    } else {
      s += `<line x1="${x2}" y1="${yy}" x2="${x1+2}" y2="${yy}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah2)"/>`;
      s += svgText(mx, yy+14, a.label, 10, false, C.text);
    }
  });

  // ---- أسهم المشرف (يمين) ----
  supArrows.forEach((a,i)=>{
    const yy = arrowStartY + i*STEP_H;
    if(yy > SY+SH-10) return;
    const x1 = SX+SW, x2 = sup.x;
    const mx = (x1+x2)/2;
    if(a.dir==='out'){
      s += `<line x1="${x1}" y1="${yy}" x2="${x2-2}" y2="${yy}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah)"/>`;
      s += svgText(mx, yy-9, a.label, 10, false, C.text);
    } else {
      s += `<line x1="${x2}" y1="${yy}" x2="${x1+2}" y2="${yy}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah2)"/>`;
      s += svgText(mx, yy+14, a.label, 10, false, C.text);
    }
  });

  // ---- أسهم الطبيب (أعلى) ----
  // النص على يمين السهم للـ out، ويسار للـ in
  const docMidX = doc.x+EW/2;
  docArrows.forEach(a=>{
    const xx = docMidX+a.dx;
    const y1 = doc.y+EH, y2 = SY;
    const my = (y1+y2)/2;
    if(a.dir==='out'){
      s += `<line x1="${xx}" y1="${y1}" x2="${xx}" y2="${y2-2}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah)"/>`;
      s += svgText(xx+6, my, a.label, 10, false, C.text, 'start');
    } else {
      s += `<line x1="${xx}" y1="${y2}" x2="${xx}" y2="${y1+2}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah2)"/>`;
      s += svgText(xx-6, my, a.label, 10, false, C.text, 'end');
    }
  });

  // ---- أسهم المستفيد (أسفل) ----
  const benMidX = ben.x+EW/2;
  benArrows.forEach(a=>{
    const xx = benMidX+a.dx;
    const y1 = ben.y, y2 = SY+SH;
    const my = (y1+y2)/2;
    if(a.dir==='out'){
      s += `<line x1="${xx}" y1="${y1}" x2="${xx}" y2="${y2+2}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah2)"/>`;
      s += svgText(xx+6, my, a.label, 10, false, C.text, 'start');
    } else {
      s += `<line x1="${xx}" y1="${y2}" x2="${xx}" y2="${y1-2}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah)"/>`;
      s += svgText(xx-6, my, a.label, 10, false, C.text, 'end');
    }
  });

  s += `</svg>`;
  return s;
}

// =====================================================================
//  DFD LEVEL 1
// =====================================================================
const rows1 = [
  { num:'1',  proc:'تسجيل الحساب',          el:'متبرع / مستفيد',               ds:'D1 — قاعدة المستخدمين',      a1:'بيانات التسجيل',                   a2:'حفظ بيانات المستخدم',        a3:'تأكيد التسجيل' },
  { num:'2',  proc:'تسجيل الدخول',           el:'متبرع / مستفيد / مشرف / طبيب', ds:'D1 — قاعدة المستخدمين',      a1:'بريد + كلمة مرور',                 a2:'بيانات المستخدم',            a3:'تأكيد الجلسة' },
  { num:'3',  proc:'إدارة الملف الشخصي',    el:'متبرع / مستفيد',               ds:'D1 — قاعدة المستخدمين',      a1:'تعديل البيانات / الصورة',          a2:'تحديث البيانات',             a3:'تأكيد الحفظ' },
  { num:'4',  proc:'إضافة حالة',             el:'مستفيد / مشرف',                ds:'D2 — قاعدة الحالات',         a1:'بيانات الحالة + صورة',             a2:'حفظ الحالة (قيد المراجعة)', a3:'تأكيد الإضافة' },
  { num:'5',  proc:'مراجعة الحالات',         el:'مشرف',                         ds:'D2 — قاعدة الحالات',         a1:'قرار القبول / الرفض',              a2:'تحديث الحالة (مقبول)',       a3:'بيانات الحالة' },
  { num:'6',  proc:'عرض الحالات',            el:'متبرع',                        ds:'D2 — قاعدة الحالات',         a1:'طلب تصفح / بحث / تصفية',          a2:'الحالات المقبولة',           a3:'قائمة الحالات' },
  { num:'7',  proc:'تفاصيل الحالة',          el:'متبرع',                        ds:'D2 — قاعدة الحالات',         a1:'معرّف الحالة (ID)',                a2:'بيانات الحالة الكاملة',      a3:'تفاصيل + مبلغ متبقي' },
  { num:'8',  proc:'عملية التبرع',           el:'متبرع',                        ds:'D3 — قاعدة التبرعات',        a1:'اسم + هاتف + مبلغ + طريقة دفع',   a2:'حفظ سجل التبرع',             a3:'تأكيد التبرع' },
  { num:'9',  proc:'معالجة الدفع',           el:'متبرع',                        ds:'D2 — قاعدة الحالات',         a1:'بيانات البطاقة / إيصال المحفظة',  a2:'تحديث remaining_amount',     a3:'تأكيد الدفع' },
  { num:'10', proc:'رفع الإيصال',            el:'متبرع',                        ds:'D4 — Supabase Storage',      a1:'ملف الإيصال',                      a2:'رفع الملف',                  a3:'رابط الإيصال' },
  { num:'11', proc:'إرسال الإشعارات',        el:'النظام (تلقائي)',               ds:'D5 — قاعدة الإشعارات',       a1:'حدث جديد (تبرع / حالة)',           a2:'حفظ الإشعار',                a3:'إشعار للمشرف' },
  { num:'12', proc:'إدارة الإشعارات',        el:'مشرف',                         ds:'D5 — قاعدة الإشعارات',       a1:'قراءة / حذف إشعار',                a2:'تحديث is_read',              a3:'قائمة الإشعارات' },
  { num:'13', proc:'إدارة المستخدمين',       el:'مشرف',                         ds:'D1 — قاعدة المستخدمين',      a1:'تغيير الحالة / الدور',             a2:'تحديث user_type / status',   a3:'بيانات المستخدمين' },
  { num:'14', proc:'مراجعة التبرعات',        el:'مشرف',                         ds:'D3 — قاعدة التبرعات',        a1:'طلب عرض التبرعات',                 a2:'سجلات التبرعات',             a3:'قائمة التبرعات' },
  { num:'15', proc:'لوحة التحكم',            el:'مشرف',                         ds:'D2 — قاعدة الحالات',         a1:'طلب الإحصائيات',                   a2:'بيانات الحالات',             a3:'إجمالي / نشط / مكتمل' },
  { num:'16', proc:'تسجيل المستفيد',         el:'مستفيد',                       ds:'D1 — قاعدة المستخدمين',      a1:'بيانات التسجيل + العنوان + الجنس', a2:'حفظ بيانات المستفيد',        a3:'تأكيد التسجيل' },
  { num:'17', proc:'مراجعة طلبات المستفيد',  el:'مشرف',                         ds:'D1 — قاعدة المستخدمين',      a1:'قبول / رفض طلب التسجيل',           a2:'تحديث الحالة',               a3:'طلبات المستفيدين' },
  { num:'18', proc:'التقارير الطبية',        el:'طبيب',                         ds:'D6 — قاعدة الرسائل الطبية', a1:'رسالة / ملف طبي',                  a2:'حفظ الرسالة',                a3:'تأكيد الإرسال' },
  { num:'19', proc:'إدارة الحالات',          el:'مشرف',                         ds:'D2 — قاعدة الحالات',         a1:'تعديل / حذف حالة',                 a2:'تحديث / حذف',                a3:'بيانات الحالة' },
  { num:'20', proc:'الشات بوت الذكي',        el:'متبرع / مستفيد',               ds:'D7 — Gemini AI API',         a1:'رسالة المستخدم',                   a2:'طلب Gemini API',             a3:'رد الذكاء الاصطناعي' },
];

function buildL1(){
  const EW=200, EH=54, PW=210, PH=70, DW=260, DH=54;
  const GAP=80, LPAD=32, ROW_GAP=48;
  const ROW_H = PH + ROW_GAP;
  const TW = LPAD + EW + GAP + PW + GAP + DW + LPAD;
  const TH = 80 + rows1.length * ROW_H + 20;
  const xE=LPAD, xP=xE+EW+GAP, xD=xP+PW+GAP;

  let s = `<svg id="svgL1" xmlns="http://www.w3.org/2000/svg"
    width="${TW}" height="${TH}" viewBox="0 0 ${TW} ${TH}"
    style="font-family:'Segoe UI',Tahoma,sans-serif;direction:rtl;background:#fff;display:block;">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="${C.arrow}"/>
    </marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="1" refY="3.5" orient="auto">
      <path d="M9,0 L9,7 L0,3.5 z" fill="${C.arrow}"/>
    </marker>
  </defs>`;

  // Header row labels
  s += svgText(xE+EW/2,   42, 'الجهة الخارجية',  13, true, C.dark);
  s += svgText(xP+PW/2,   42, 'العملية (Process)',13, true, C.dark);
  s += svgText(xD+DW/2,   42, 'مخزن البيانات',   13, true, C.dark);

  rows1.forEach((r,i)=>{
    const Y   = 60 + i*ROW_H;
    const midY= Y + PH/2;
    const eY  = Y + (PH-EH)/2;
    const dY  = Y + (PH-DH)/2;
    const half= Math.round(PH*0.42);

    // Entity
    s += svgEntity(xE, eY, EW, EH, r.el);

    // Process
    s += svgRect(xP, Y, PW, half, C.dark, C.dark, 0, 0);
    s += svgRect(xP, Y+half, PW, PH-half, C.light, C.dark, 0, 1.8);
    s += `<rect x="${xP}" y="${Y}" width="${PW}" height="${PH}" fill="none" stroke="${C.dark}" stroke-width="2"/>`;
    s += svgText(xP+PW/2, Y+half/2, r.num, 14, true, C.white);
    const pLines = wrapAr(r.proc, 18);
    const plh=13, pStartY=Y+half+(PH-half)/2-(pLines.length-1)*plh/2;
    pLines.forEach((l,j)=>{ s += svgText(xP+PW/2, pStartY+j*plh, l, 11, false, C.dark); });

    // Data Store
    s += svgStore(xD, dY, DW, DH, r.ds);

    // Arrow 1: Entity → Process (top lane)
    const y1 = midY - 12;
    s += `<line x1="${xE+EW}" y1="${y1}" x2="${xP-2}" y2="${y1}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah)"/>`;
    s += svgText((xE+EW+xP)/2, y1-10, r.a1, 10, false, C.text);

    // Arrow 2: Process → DataStore (top lane)
    s += `<line x1="${xP+PW}" y1="${y1}" x2="${xD-2}" y2="${y1}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah)"/>`;
    s += svgText((xP+PW+xD)/2, y1-10, r.a2, 10, false, C.text);

    // Arrow 3: DataStore → Process (bottom lane — response)
    const y3 = midY + 12;
    s += `<line x1="${xD}" y1="${y3}" x2="${xP+PW+2}" y2="${y3}" stroke="${C.arrow}" stroke-width="1.5" marker-end="url(#ah2)"/>`;
    s += svgText((xP+PW+xD)/2, y3+15, r.a3, 10, false, C.text);

    // Separator
    if(i < rows1.length-1)
      s += `<line x1="${LPAD}" y1="${Y+PH+ROW_GAP/2}" x2="${TW-LPAD}" y2="${Y+PH+ROW_GAP/2}" stroke="#ccd" stroke-width="0.8"/>`;
  });

  s += `</svg>`;
  return s;
}

// =====================================================================
//  INIT
// =====================================================================
document.getElementById('l0wrap').innerHTML = buildL0();
document.getElementById('l1wrap').innerHTML = buildL1();
</script>
