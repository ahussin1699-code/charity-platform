<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقييمات - تبرعات خيرية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/التقييمات.css">
</head>
<body>

<header>
  <a href="الصفحه الرئسيه.html" class="logo"><i class="fa-solid fa-hands-holding-heart"></i> تبرعات خيرية</a>
  <a href="الصفحه الرئسيه.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
</header>

<div class="page-hero">
  <h1><i class="fa-solid fa-star"></i> تقييمات المتبرعين</h1>
  <p>آراء حقيقية من متبرعين استخدموا المنصة</p>
</div>

<!-- ملخص -->
<div class="rating-summary">
  <div class="rating-big">
    <div class="num" id="avgRating">0</div>
    <div class="stars" id="avgStars">☆☆☆☆☆</div>
    <div class="total" id="totalReviews">0 تقييم</div>
  </div>
  <div class="rating-bars" id="ratingBars">
    <div class="bar-row"><span>5 ★</span><div class="bar-track"><div class="bar-fill" id="bar5" style="width:0%"></div></div><span id="cnt5">0</span></div>
    <div class="bar-row"><span>4 ★</span><div class="bar-track"><div class="bar-fill" id="bar4" style="width:0%"></div></div><span id="cnt4">0</span></div>
    <div class="bar-row"><span>3 ★</span><div class="bar-track"><div class="bar-fill" id="bar3" style="width:0%"></div></div><span id="cnt3">0</span></div>
    <div class="bar-row"><span>2 ★</span><div class="bar-track"><div class="bar-fill" id="bar2" style="width:0%"></div></div><span id="cnt2">0</span></div>
    <div class="bar-row"><span>1 ★</span><div class="bar-track"><div class="bar-fill" id="bar1" style="width:0%"></div></div><span id="cnt1">0</span></div>
  </div>
</div>

<!-- فورم التقييم -->
<div class="review-form-wrap">
  <div class="review-form">
    <h2><i class="fa-solid fa-pen-to-square"></i> أضف تقييمك</h2>
    <div class="star-select">
      <input type="radio" name="rating" id="s5" value="5"><label for="s5">★</label>
      <input type="radio" name="rating" id="s4" value="4"><label for="s4">★</label>
      <input type="radio" name="rating" id="s3" value="3"><label for="s3">★</label>
      <input type="radio" name="rating" id="s2" value="2"><label for="s2">★</label>
      <input type="radio" name="rating" id="s1" value="1"><label for="s1">★</label>
    </div>
    <input type="text" id="reviewName" placeholder="اسمك (اختياري)">
    <textarea id="reviewText" placeholder="اكتب تجربتك مع المنصة..."></textarea>
    <button class="submit-review" id="submitReview" onclick="submitReview()">إرسال التقييم</button>
    <div class="form-msg" id="formMsg"></div>
  </div>
</div>

<!-- قائمة التقييمات -->
<div class="reviews-section">
  <h2>جميع التقييمات</h2>
  <div class="reviews-grid" id="reviewsGrid">
    <div style="grid-column:1/-1;text-align:center;color:#aaa;padding:20px;">جاري التحميل...</div>
  </div>
  <button class="load-more" id="loadMoreBtn" style="display:none;" onclick="loadMore()">تحميل المزيد</button>
</div>

<footer>جميع الحقوق محفوظة &copy; 2025 منصة تبرعات خيرية</footer>

<script src="../Js/config.js"></script>
<script src="../Js/التقييمات.js"></script>
</body>
</html>
